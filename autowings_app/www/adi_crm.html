    <!-- Custom Tailwind Config & CSS -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#84cc16',
                            '50': '#f7fee7',
                            '100': '#ecfccb',
                            '200': '#d9f99d',
                            '300': '#bef264',
                            '400': '#a3e635',
                            '500': '#84cc16',
                            '600': '#65a30d',
                            '700': '#4d7c0f',
                            '800': '#3f6212',
                            '900': '#365314',
                            '950': '#1a2e05',
                        },
                        saffron: '#f97316',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for better aesthetics in dark mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-track { background: #1f2937; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

    </style>

                'calendar': (date) => {
                    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                    const startOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
                    const endOfMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0);
                    const startDay = startOfMonth.getDay();
                    const daysInMonth = endOfMonth.getDate();
                    const today = new Date();

                    let calendarHtml = `<div class="flex justify-between items-center mb-8">
                        <div class="flex items-center gap-4">
                            <button id="prev-month-btn" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>

                            <button id="next-month-btn" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                        </div>
                        <button id="add-event-btn" class="bg-primary text-white font-semibold py-2 px-4 rounded-lg shadow-sm hover:bg-primary-600 transition flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5"></i>Add Event</button>
                    </div>
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                        <div class="grid grid-cols-7 gap-px text-center font-semibold text-gray-600 dark:text-gray-300 mb-2">
                            ${daysOfWeek.map(day => `<div>${day}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-7 gap-px">`;

                    for (let i = 0; i < startDay; i++) { calendarHtml += `<div class="h-32 bg-gray-50 dark:bg-gray-900/50 border border-transparent"></div>`; }
                    
                    for (let day = 1; day <= daysInMonth; day++) {
                        const isToday = day === today.getDate() && date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear() ? 'bg-primary/20' : '';
                        const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                        const eventsOnDay = calendarEvents.filter(e => e.date === dateStr);
                        calendarHtml += `<div class="h-32 bg-gray-50 dark:bg-gray-900/50 p-2 text-left relative overflow-y-auto border border-gray-100 dark:border-gray-700/50 ${isToday}">
                            <span class="font-semibold">${day}</span>
                            <div class="mt-1 space-y-1">
                                ${eventsOnDay.map(event => `<div class="text-xs p-1 rounded-md text-white ${event.color}">${event.title}</div>`).join('')}
                            </div>
                        </div>`;
                    }
                    calendarHtml += `</div></div>`;
                    return calendarHtml;
                },
                 'settings': () => `

            };
            
            // --- APP STATE & LOGIC --- //
            let currentDate = new Date();

                    const templateFunction = pageTemplates[pageId];

                            ? templateFunction(currentDate)
                            : templateFunction();

                    targetPage.classList.remove('hidden');
                    if (pageId === 'dashboard') setupDashboardCharts();
                    lucide.createIcons();

            }
            
            function setActiveLink(link) {
                 navLinks.forEach(l => l.classList.remove('bg-primary', 'text-white', 'shadow-lg'));
                 link.classList.add('bg-primary', 'text-white', 'shadow-lg');
            }

            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const pageId = this.dataset.page;
                    pageTitle.textContent = this.querySelector('.nav-text').textContent;
                    setActiveLink(this);
                    showPage(pageId);
                });

            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('w-64');
                sidebar.classList.toggle('w-20');
                sidebar.querySelectorAll('.nav-text, .logo-text, .nav-subtitle, .sales-target-details').forEach(el => {
                    el.classList.toggle('hidden');
                });
                sidebar.querySelectorAll('#main-nav .nav-link, .sidebar-header').forEach(el => {
                     el.classList.toggle('justify-center');
                });
                const icon = sidebarToggle.querySelector('i');
                if (sidebar.classList.contains('w-20')) {
                    icon.setAttribute('data-lucide', 'chevrons-right');
                } else {
                    icon.setAttribute('data-lucide', 'chevrons-left');
                }
                lucide.createIcons();

            // --- MODAL & AI Logic --- //
            document.body.addEventListener('click', async function(e) {
                // Modal Openers
                if (e.target.closest('#new-task-btn')) newTaskModal.classList.remove('hidden');
                if (e.target.closest('#add-lead-btn')) newLeadModal.classList.remove('hidden');
                if (e.target.closest('#add-event-btn')) newEventModal.classList.remove('hidden');
                
                // Modal Closers
                if (e.target.closest('.modal-close')) e.target.closest('.fixed').classList.add('hidden');
                
                // Save Task
                if (e.target.closest('#save-task-btn')) {
                    const description = document.getElementById('task-description').value;
                    if(description) {
                         priorityTasksData.unshift({ id: Date.now(), text: description, completed: false });
                         newTaskModal.classList.add('hidden');
                         showPage('my-day'); 
                    }
                }
                
                // Save Lead
                if (e.target.closest('#save-lead-btn')) {
                    const name = document.getElementById('lead-name').value;
                    if(name) {
                         allLeads.push({ id: `#L-5${allLeads.length+1}`, name, source: document.getElementById('lead-source').value, vehicle: document.getElementById('lead-vehicle').value, status: 'New Lead'});
                         newLeadModal.classList.add('hidden');
                         showPage('my-leads');
                    }
                }

                // Save Event
                 if (e.target.closest('#save-event-btn')) {
                    const title = document.getElementById('event-title').value;
                    const date = document.getElementById('event-date').value;
                    if(title && date) {
                         calendarEvents.push({ date, title, color: 'bg-primary' });
                         newEventModal.classList.add('hidden');
                         showPage('calendar');
                    }
                }

                // Calendar Navigation
                if(e.target.closest('#prev-month-btn')) {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    showPage('calendar');
                }
                if(e.target.closest('#next-month-btn')) {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    showPage('calendar');
                }

                 // AI Buttons
                const suggestStepsBtn = e.target.closest('#suggest-steps-btn');
                if (suggestStepsBtn) {
                     const button = suggestStepsBtn;
                    const incompleteTasks = Array.from(document.querySelectorAll('#priority-tasks-list .task-checkbox:not(:checked)'))
                        .map(task => task.dataset.task);

                    if (incompleteTasks.length === 0) {
                        showAiModal('✨ Suggested Steps', '<p>No incomplete tasks! You\'re all caught up.</p>', '<button class="modal-close bg-primary text-white font-semibold py-2 px-4 rounded-lg">Close</button>');
                        return;
                    }

                    const prompt = `As a sales assistant for a car dealership, here is a list of my priority tasks: "${incompleteTasks.join(', ')}". Suggest a prioritized list of the next logical steps to complete them efficiently. Format the response as a simple HTML ordered list (<ol><li>...</li></ol>).`;
                    
                    const response = await callGemini(prompt, button);
                    showAiModal('✨ Suggested Steps', response, '<button class="modal-close bg-primary text-white font-semibold py-2 px-4 rounded-lg">Done</button>');
                }

                const draftEmailBtn = e.target.closest('.draft-email-btn');

                    const response = await callGemini(prompt, draftEmailBtn);

                        if (!document.getElementById('page-dashboard').classList.contains('hidden')) {
                            setupDashboardCharts();
                        }
                     } else {

                         updateToggleVisuals(toggle, isEnabled);
                     }
                }

            function updateToggleVisuals(toggleButton, isEnabled) {
                const thumb = toggleButton.querySelector('span');

                    toggleButton.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                    toggleButton.classList.add('bg-primary');
                    thumb.classList.add('translate-x-5');

                    toggleButton.classList.add('bg-gray-200', 'dark:bg-gray-700');
                    thumb.classList.remove('translate-x-5');
                    toggleButton.dataset.state = 'off';
                }
            }

             async function callGemini(prompt, button) {
                const originalContent = button.innerHTML;
                button.innerHTML = '<div class="spinner"></div>';
                button.disabled = true;

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                const payload = { contents: [{ parts: [{ text: prompt }] }] };

                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0 && result.candidates[0].content.parts.length > 0) {
                        return result.candidates[0].content.parts[0].text;
                    }
                    return "Sorry, I couldn't generate a response. Please try again.";
                } catch (error) {
                    return "An error occurred while contacting the AI assistant.";
                } finally {
                    button.innerHTML = originalContent;
                    lucide.createIcons();
                    button.disabled = false;
                }
            }

            function showAiModal(title, body, footer) {
                document.getElementById('ai-modal-title').innerHTML = title;
                document.getElementById('ai-modal-body').innerHTML = body;
                document.getElementById('ai-modal-footer').innerHTML = footer;
                aiModal.classList.remove('hidden');
                lucide.createIcons();
            }
            
             function setupDashboardCharts() {
                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#e5e7eb' : '#374151';
                const gridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
                Chart.defaults.color = textColor;
                const salesCtx = document.getElementById('salesChart')?.getContext('2d');
                if (salesCtx) { new Chart(salesCtx, { type: 'bar', data: { labels: salesAndServiceData.map(d => d.name), datasets: [ { label: 'Sales ($k)', data: salesAndServiceData.map(d => d.sales), backgroundColor: '#84cc16' }, { label: 'Service ($k)', data: salesAndServiceData.map(d => d.service), backgroundColor: '#a3e635' } ] }, options: { scales: { y: { beginAtZero: true, grid: { color: gridColor } }, x: { grid: { color: gridColor } } }, plugins: { legend: { labels: { color: textColor } } } } }); }
                const salesTypeCtx = document.getElementById('salesTypeChart')?.getContext('2d');
                if (salesTypeCtx) { new Chart(salesTypeCtx, { type: 'pie', data: { labels: salesByTypeData.map(d => d.name), datasets: [{ data: salesByTypeData.map(d => d.value), backgroundColor: ['#84cc16', '#a3e635', '#4d7c0f', '#bef264'], borderWidth: 0 }] }, options: { plugins: { legend: { labels: { color: textColor } } } } }); }
            }

            // Initial Load
            showPage('my-day');
            setActiveLink(document.querySelector('.nav-link[data-page="my-day"]'));
        });
    </script>
</body>
